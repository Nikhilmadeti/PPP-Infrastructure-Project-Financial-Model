# Base case: BOT toll road. This IS the README Section 11 worked example, so the model must
# reproduce Tables 11.1-11.3 from these inputs (tests/test_worked_example.py).
#
# Units: money in ₹ crore; rates and shares as decimals (0.10 = 10%); traffic in PCU/day;
# toll in ₹ per PCU-trip. Optional features are off so the hand check stays simple (README §8).
# README symbol for each key in [brackets]; full mapping in docs/model_methodology.md.

project:
  name: "BOT toll road - README worked example"
  type: toll
  first_fiscal_year: 2026            # label only: model year 1 = FY2026-27

timeline:
  construction_years: 3              # [Tc]
  concession_years: 20               # [Tcon] from the appointed date, so operations [To] = 17
  concession_end_fixed: true         # a construction delay shortens operations (README §9.1)
  indexation_basis: cod              # growth/escalation exponent = k-1 (README §9.5); 'calendar' = years since scheduled COD

capex:
  base_cost: 1000.0                  # [C0] hard cost at today's prices
  phasing: [0.30, 0.40, 0.30]        # [p_t] must sum to 100%
  escalation: 0.0                    # [e_c]
  contingency: 0.0                   # [cont] share of hard cost
  preop: 0.0                         # [preop] share of hard cost

funding:
  gearing: 0.70                      # [g] debt share of (uses - grant)
  grant_pct: 0.0                     # [grant_pct] VGF as a share of capex
  grant_covers_overrun: false        # VGF is fixed at award, so an overrun is funded by debt/equity
  equity_mode: pro_rata              # [eq_mode] pro_rata | equity_first
  drawdown_timing: 0.5               # [m] mid-year drawdown convention for IDC
  upfront_fee: 0.0                   # [fee] share of debt at COD, paid in model year 1

debt:
  interest_rate: 0.10                # [r] all-in
  tenor_years: 15                    # [n] repayment years after the moratorium
  moratorium_years: 0                # [mor]
  profile: annuity                   # [profile] equal | annuity | structured | sculpted
  # [s_k] used only when profile = structured; a rising ("ballooning") bank profile, sums to 100%
  structured_pct: [0.030, 0.035, 0.040, 0.045, 0.050, 0.055, 0.060, 0.065,
                   0.070, 0.075, 0.080, 0.085, 0.090, 0.100, 0.120]
  target_dscr: 1.30                  # [dscr_target] for sculpting and DSCR-based sizing
  sizing: gearing                    # gearing | gearing_and_dscr (debt = min of the two limits)
  sculpt_negative_principal: floor   # floor: principal >= 0 (interest-only that year) | capitalise

reserves:
  dsra_months: 0                     # [dsra_months] months of next year's debt service
  dsra_initial_funding: cash_flow    # cash_flow (built from CFADS) | construction (in project cost at COD)
  mmra_enabled: false
  mmra_position: after_debt_service  # README §9.11 order | in_cfads (README §9.8 alternative)
  lockup_dscr: null                  # [lockup] null = off

revenue:
  toll:
    aadt: 24000                      # [AADT0] PCU/day at COD, mature level before ramp-up
    growth: 0.04                     # [g_tr]
    rate: 200.0                      # [rate0] ₹ per PCU-trip at COD
    rate_escalation: 0.03            # [e_toll]
    ramp_up: [0.85, 0.95, 1.00]      # [R_k] op years 1, 2, 3; 100% afterwards
    leakage: 0.0                     # [leak]
    capacity: null                   # [cap] PCU/day; null = no cap
    days_per_year: 365

opex:
  om_base: 20.0                      # [OM0] op-year-1 prices
  om_escalation: 0.05                # [e_om] also escalates major maintenance
  mmr_base: 50.0                     # [MMR0] op-year-1 prices
  mmr_years: [5, 10, 15]             # operating years with resurfacing
  concession_fee_pct: 0.0            # revenue share to the Authority
  concession_premium: 0.0            # fixed premium, op-year-1 prices
  premium_escalation: 0.0

tax:
  rate: 0.2517                       # [tax] Sec 115BAA effective rate
  depreciation_years: null           # null = straight-line over the operating period
  depreciation_net_of_grant: true    # grant-funded cost is not depreciated
  loss_carry_forward_years: null     # null = unlimited (README base); 8 = Income-tax Act business-loss limit

valuation:
  discount_rate: 0.12                # project NPV discount rate
  equity_hurdle: 0.15                # sponsor's required Equity IRR
  terminal_value: 0.0                # cash at handback

covenants:
  min_dscr: 1.20                     # lender covenant (toll 1.20-1.30x): amber below, red below 1.00x
  min_llcr: 1.30

stress:                              # scenario levers; all neutral in the base case
  demand_shortfall: 0.0              # [short] traffic shortfall
  cost_overrun: 0.0                  # [overrun] on hard cost
  overrun_funding: pro_rata          # [overrun_mode] pro_rata | equity
  delay_years: 0                     # [delay_years] whole years
  delay_phasing: null                # null = stretch the phasing S-curve over Tc + delay
  rate_shock: 0.0                    # added to [r]; 0.01 = +100 bp

solver:
  tolerance: 1.0e-10
  max_iterations: 200
