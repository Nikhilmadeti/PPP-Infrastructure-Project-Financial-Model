[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppp-model"
version = "1.0.0"
description = "PPP infrastructure project financial model (BOT toll, metro, HAM): IDC, debt schedule, DSCR/LLCR, IRRs, scenarios."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "numpy-financial>=1.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "xlsxwriter>=3.2",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.50", "plotly>=5.24", "matplotlib>=3.8", "google-genai>=1.0"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
